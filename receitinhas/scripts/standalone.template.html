<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receitinhas · ideias sem açúcar para as crianças</title>
<meta name="description" content="Receitas sem açúcar e sal opcional para bebês e crianças, filtros para alergias (sem ovo, sem trigo, sem leite/APLV, sem banana) e gerador de cardápio com IA (com login pelo ChatGPT).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff8c7a'/%3E%3Cpath d='M12 38a20 14 0 0 0 40 0z' fill='%23fff8ef'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%23b9ecd6'/%3E%3Ccircle cx='36' cy='20' r='5' fill='%23f6c2dc'/%3E%3Ccircle cx='44' cy='28' r='4' fill='%23fff0a6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff8ef;--ink:#3d3a4a;--ink-soft:#6f6b7d;--coral:#ff8c7a;--coral-dark:#e86f5d;
    --peach:#ffd8b8;--mint:#b9ecd6;--mint-dark:#3ea67c;--sky:#cfe6ff;--lilac:#dcd4ff;
    --sun:#fff0a6;--berry:#f6c2dc;--radius:2rem;--shadow:0 10px 30px -12px rgba(61,58,74,.18);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.5;
    background-image:radial-gradient(circle at 10% 10%,rgba(255,216,184,.45),transparent 35%),radial-gradient(circle at 90% 20%,rgba(185,236,214,.4),transparent 30%),radial-gradient(circle at 70% 90%,rgba(220,212,255,.4),transparent 35%);background-attachment:fixed}
  h1,h2,h3,h4,.display{font-family:"Fredoka",system-ui,sans-serif;margin:0;line-height:1.15}
  h1{font-size:2.4rem}h2{font-size:1.8rem}h3{font-size:1.25rem}
  @media(min-width:768px){h1{font-size:3.2rem}h2{font-size:2rem}}
  p{margin:0}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0}
  ul,ol{margin:0;padding-left:1.25rem}
  .wrap{max-width:72rem;margin:0 auto;padding:0 1rem 4rem}
  .muted{color:var(--ink-soft)}
  .center{text-align:center}
  .stack>*+*{margin-top:1rem}
  .section{margin-top:3rem}
  .grid{display:grid;gap:1.25rem}
  .grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.grid-5{grid-template-columns:1fr}
  @media(min-width:640px){.grid-2,.grid-3,.grid-5{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1024px){.grid-3{grid-template-columns:repeat(3,1fr)}.grid-5{grid-template-columns:repeat(5,1fr)}}
  .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:2px solid rgba(61,58,74,.06);padding:1.25rem}
  a.card,button.card{display:block;transition:transform .15s}
  a.card:hover{transform:translateY(-4px)}
  .chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.45rem .9rem;font-weight:700;font-size:.85rem;border:2px solid transparent;background:var(--cream);cursor:pointer;transition:transform .15s}
  .chip:hover{transform:translateY(-1px)}
  .chip.sm{font-size:.72rem;padding:.3rem .6rem}
  .chip.on{background:var(--coral);color:#fff;box-shadow:0 6px 16px -8px var(--coral-dark)}
  .chip.ink{background:var(--ink);color:#fff}
  .chip.ring{box-shadow:0 0 0 2px rgba(61,58,74,.3)}
  .bg-sun{background:var(--sun)}.bg-mint{background:var(--mint)}.bg-berry{background:var(--berry)}.bg-sky{background:var(--sky)}
  .bg-peach{background:var(--peach)}.bg-lilac{background:var(--lilac)}.bg-white{background:#fff}.bg-mint-soft{background:rgba(185,236,214,.6)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:.8rem 1.4rem;font-weight:700;font-family:"Fredoka",sans-serif;cursor:pointer;transition:transform .15s,background .15s}
  .btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
  .btn-primary{background:var(--coral);color:#fff;box-shadow:0 10px 24px -10px rgba(232,111,93,.7)}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-ghost{background:#fff;border:2px solid rgba(61,58,74,.1)}
  .big{font-size:1.1rem}
  .emoji{line-height:1}
  .input{width:100%;border-radius:999px;border:2px solid rgba(61,58,74,.1);background:var(--cream);padding:.75rem 1.25rem;font:inherit;outline:none}
  .input:focus{border-color:var(--coral)}
  textarea.input{border-radius:1.5rem;resize:vertical}
  .alert{border-radius:1rem;background:rgba(255,140,122,.15);border:1px solid rgba(255,140,122,.4);padding:.5rem .75rem;font-size:.9rem}
  .note{border-radius:1rem;background:rgba(185,236,214,.4);padding:.5rem .75rem;font-size:.9rem}
  .label{font-weight:800;display:block;margin-bottom:.5rem}
  nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(8px);background:rgba(255,248,239,.85);border-bottom:1px solid rgba(61,58,74,.05)}
  nav .bar{max-width:72rem;margin:0 auto;padding:0 1rem;height:4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .brand{font-family:"Fredoka",sans-serif;font-size:1.5rem;font-weight:700;color:var(--coral-dark);display:flex;align-items:center;gap:.5rem}
  .links{display:none;gap:.25rem}
  .menu-btn{display:inline-flex}
  @media(min-width:768px){.links{display:flex}.menu-btn{display:none}}
  .links .chip{background:rgba(255,255,255,.7)}
  .links .chip.on{background:var(--coral);color:#fff}
  .mobile-links{display:flex;flex-wrap:wrap;gap:.5rem;padding:0 1rem 1rem}
  .mobile-links .chip{background:#fff}
  .hidden{display:none!important}
  .step{display:flex;gap:.75rem;margin-bottom:.75rem}
  .step b{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif}
  footer{text-align:center;font-size:.85rem;color:var(--ink-soft);padding:0 1rem 2rem;max-width:42rem;margin:0 auto}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
  .float{display:inline-block;animation:float 4s ease-in-out infinite}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .pop{animation:pop .25s ease-out both}
  @keyframes dots{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--coral);animation:dots 1.2s infinite ease-in-out}
  @media print{nav,footer,.no-print{display:none!important}body{background:#fff}.print-show{display:block!important}}
</style>
</head>
<body>
<nav>
  <div class="bar">
    <a href="#inicio" class="brand"><span class="float" aria-hidden="true">🥣</span>Receitinhas</a>
    <div class="links" id="links"></div>
    <button class="chip menu-btn" id="menu-btn" aria-label="Abrir menu">☰ Menu</button>
  </div>
  <div class="mobile-links hidden" id="mobile-links"></div>
</nav>
<main class="wrap" id="app"></main>
<footer>
  Feito com carinho para mães e pais. As informações aqui são educativas e não substituem a orientação do pediatra ou nutricionista da sua família. Em caso de alergia, converse sempre com o médico antes de introduzir alimentos novos.
</footer>

<script>
/* ============================================================
   CONFIGURAÇÃO
   Para o gerador com IA funcionar, publique a pasta "receitinhas"
   na Vercel (veja o README) e coloque aqui o endereço do seu app:
   ============================================================ */
const APP_URL = "https://SEU-APP.vercel.app";

const DATA = __DATA__;
</script>
<script>
(function(){
  const $ = (s, el=document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const { receitas, ALERGENOS, REFEICOES, IDADES, IDADE_LABEL } = DATA;
  const API_URL = APP_URL + "/api/gerar";
  const configurado = !APP_URL.includes("SEU-APP");
  const ALG = Object.keys(ALERGENOS), REF = Object.keys(REFEICOES), ORDEM_IDADE = ["6m","9m","12m"];

  /* ---------- navegação ---------- */
  const LINKS = [["inicio","🏠 Início"],["receitas","📖 Receitas"],["gerar","✨ Gerar com IA"]];
  function renderNav(){
    const cur = route().view === "receita" ? "receitas" : route().view;
    const html = LINKS.map(([h,l]) => `<a class="chip ${cur===h?"on":""}" href="#${h}">${l}</a>`).join("");
    $("#links").innerHTML = html; $("#mobile-links").innerHTML = html;
  }
  $("#menu-btn").addEventListener("click", () => $("#mobile-links").classList.toggle("hidden"));
  $("#mobile-links").addEventListener("click", () => $("#mobile-links").classList.add("hidden"));

  function route(){
    const h = location.hash.replace(/^#/, "") || "inicio";
    const [view, ...rest] = h.split("/");
    const q = new URLSearchParams(rest.join("/").includes("?") ? rest.join("/").split("?")[1] : (view.includes("?") ? view.split("?")[1] : ""));
    return { view: view.split("?")[0], param: rest.join("/").split("?")[0], q };
  }

  /* ---------- pedaços reutilizáveis ---------- */
  const tagRef = r => `<span class="chip sm ${REFEICOES[r].cor}">${REFEICOES[r].emoji} ${REFEICOES[r].label}</span>`;
  const tagIdade = i => `<span class="chip sm bg-sky">👶 ${IDADES[i]}</span>`;
  const tagsAlg = (r, compact) => `<div class="row" style="gap:.35rem">${ALG.filter(k=>r[k]).map(k=>`<span class="chip sm bg-mint-soft">✓ ${compact?ALERGENOS[k].curto:ALERGENOS[k].label}</span>`).join("")}</div>`;
  const cardReceita = r => `
    <a class="card pop" href="#receita/${r.slug}" style="display:flex;flex-direction:column;gap:.75rem">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="emoji" style="font-size:3rem">${r.emoji}</span><span class="muted" style="font-size:.75rem;font-weight:800">⏱️ ${r.tempo} min</span></div>
      <h3>${esc(r.nome)}</h3>
      <div class="row" style="gap:.35rem">${tagRef(r.refeicao)}${tagIdade(r.idadeMin)}</div>
      ${tagsAlg(r,true)}
    </a>`;


  /* ---------- telas ---------- */
  const views = {};

  views.inicio = () => {
    const destaques = ["panqueca-de-aveia-sem-ovo","almondegas-de-carne-com-aveia","cookies-de-aveia-e-maca"].map(s=>receitas.find(r=>r.slug===s)).filter(Boolean);
    return `
      <section class="center stack" style="padding-top:2.5rem">
        <div class="emoji" style="font-size:4rem;display:flex;justify-content:center;gap:.75rem" aria-hidden="true"><span class="float">🍓</span><span class="float" style="animation-delay:.6s">🥑</span><span class="float" style="animation-delay:1.2s">🥕</span></div>
        <h1>Ideias de <span style="color:var(--coral-dark)">receitinhas</span><br>para todo dia, sem sufoco</h1>
        <p class="muted big" style="max-width:40rem;margin:0 auto">Receitas sem açúcar, com sal opcional, pensadas para bebês e crianças. Filtre por alergia ou gere um cardápio da semana com o que você tem em casa.</p>
        <div class="row" style="justify-content:center"><a class="btn btn-primary big" href="#gerar">✨ Gerar cardápio com IA</a><a class="btn btn-ghost big" href="#receitas">📖 Ver todas as receitas</a></div>
      </section>
      <section class="grid grid-2 section">
        <a class="card bg-peach" href="#receitas"><div class="emoji" style="font-size:3rem">📖</div><h2 style="margin-top:.5rem">Receitas</h2><p class="muted">Sem açúcar, sal opcional e separadas por alergia. Café, almoço, jantar e lanche.</p></a>
        <a class="card bg-lilac" href="#gerar"><div class="emoji" style="font-size:3rem">✨</div><h2 style="margin-top:.5rem">Gerar com IA</h2><p class="muted">Diga o que tem na geladeira e receba 7 cafés, 7 almoços/jantares e 7 lanches. Pode usar o seu ChatGPT.</p></a>
      </section>
      <section class="section stack">
        <h2>Escolha pela necessidade da sua família</h2>
        <div class="grid grid-5">
          <a class="card" href="#receitas"><div class="emoji" style="font-size:2.5rem">🌟</div><h3 style="margin-top:.5rem">Gerais</h3><p class="muted" style="font-size:.9rem">Sem açúcar e sal opcional, sempre.</p><p style="font-size:.75rem;font-weight:800;color:var(--coral-dark);margin-top:.5rem">${receitas.length} receitas</p></a>
          ${ALG.map(k=>`<a class="card" href="#receitas?filtro=${k}"><div class="emoji" style="font-size:2.5rem">${ALERGENOS[k].emoji}</div><h3 style="margin-top:.5rem">${ALERGENOS[k].label}</h3><p class="muted" style="font-size:.9rem">${ALERGENOS[k].descricao}</p><p style="font-size:.75rem;font-weight:800;color:var(--coral-dark);margin-top:.5rem">${receitas.filter(r=>r[k]).length} receitas</p></a>`).join("")}
        </div>
      </section>
      <section class="section row">${REF.map(k=>`<a class="chip big ${REFEICOES[k].cor}" href="#receitas?refeicao=${k}">${REFEICOES[k].emoji} ${REFEICOES[k].label}</a>`).join("")}</section>
      <section class="section stack"><h2>Queridinhas da casa</h2><div class="grid grid-3">${destaques.map(cardReceita).join("")}</div></section>
      <section class="section card bg-sun" style="background:rgba(255,240,166,.6)">
        <h2 style="margin-bottom:1rem">Nossas regrinhas de ouro</h2>
        <div class="grid grid-3">
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="emoji" style="font-size:1.8rem">🚫🍬</span><span><b>Zero açúcar</b> até os 2 anos: nem mel, nem adoçante, nem suco de caixinha.</span></div>
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="emoji" style="font-size:1.8rem">🧂</span><span><b>Sal opcional:</b> nada antes de 1 ano, e só uma pitadinha depois.</span></div>
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="emoji" style="font-size:1.8rem">🥣</span><span><b>Comida de verdade:</b> ingredientes simples que você já tem em casa.</span></div>
        </div>
      </section>`;
  };

  const filtro = { alergenos: [], refeicao: "todas", idade: "todas", busca: "" };
  views.receitas = (q) => {
    if (q.has("filtro")) filtro.alergenos = q.getAll("filtro").filter(f=>ALG.includes(f));
    if (q.has("refeicao")) filtro.refeicao = REF.includes(q.get("refeicao")) ? q.get("refeicao") : "todas";
    return `
      <header class="stack" style="padding-top:2.5rem"><h1>📖 Receitas</h1><p class="muted big" style="max-width:40rem">Todas sem açúcar e com sal opcional. Marque as restrições da sua família e a gente mostra só o que serve.</p></header>
      <div class="card stack no-print" style="margin-top:1.5rem">
        <div><span class="label">🩺 Restrições (pode marcar mais de uma)</span><div class="row" id="f-alg"></div></div>
        <div class="grid grid-2">
          <div><span class="label">🍽️ Refeição</span><div class="row" id="f-ref"></div></div>
          <div><span class="label">👶 Idade do bebê</span><div class="row" id="f-idade"></div></div>
        </div>
        <label><span class="label">🔎 Buscar por nome ou ingrediente</span><input class="input" id="f-busca" type="search" placeholder="Ex.: abóbora, frango, aveia..."></label>
      </div>
      <p class="muted" id="f-count" style="font-weight:800;margin-top:1.5rem"></p>
      <div class="grid grid-3" id="f-lista" style="margin-top:1rem"></div>`;
  };
  views.receitas.after = () => {
    const paint = () => {
      $("#f-alg").innerHTML = ALG.map(a=>`<button class="chip ${filtro.alergenos.includes(a)?"on":""}" data-alg="${a}" aria-pressed="${filtro.alergenos.includes(a)}">${ALERGENOS[a].emoji} ${ALERGENOS[a].label}</button>`).join("");
      $("#f-ref").innerHTML = `<button class="chip ${filtro.refeicao==="todas"?"ink":""}" data-ref="todas">Todas</button>` + REF.map(k=>`<button class="chip ${filtro.refeicao===k?REFEICOES[k].cor+" ring":""}" data-ref="${k}">${REFEICOES[k].emoji} ${REFEICOES[k].label}</button>`).join("");
      $("#f-idade").innerHTML = `<button class="chip ${filtro.idade==="todas"?"ink":""}" data-idade="todas">Todas</button>` + ORDEM_IDADE.map(i=>`<button class="chip ${filtro.idade===i?"bg-sky ring":""}" data-idade="${i}">${IDADES[i]}</button>`).join("");
      $("#f-busca").value = filtro.busca;
      const termo = filtro.busca.trim().toLowerCase();
      const lista = receitas.filter(r => !filtro.alergenos.some(a=>!r[a]) && (filtro.refeicao==="todas"||r.refeicao===filtro.refeicao) && (filtro.idade==="todas"||ORDEM_IDADE.indexOf(r.idadeMin)<=ORDEM_IDADE.indexOf(filtro.idade)) && (!termo || [r.nome,...r.ingredientes].join(" ").toLowerCase().includes(termo)));
      $("#f-count").textContent = lista.length===0 ? "Nenhuma receita com essa combinação ainda. Tente tirar um filtro ou use o gerador com IA ✨" : `${lista.length} ${lista.length===1?"receita encontrada":"receitas encontradas"}`;
      $("#f-lista").innerHTML = lista.map(cardReceita).join("");
    };
    $("#app").addEventListener("click", e => {
      const b = e.target.closest("button[data-alg],button[data-ref],button[data-idade]"); if(!b) return;
      if (b.dataset.alg) filtro.alergenos = filtro.alergenos.includes(b.dataset.alg) ? filtro.alergenos.filter(x=>x!==b.dataset.alg) : [...filtro.alergenos, b.dataset.alg];
      if (b.dataset.ref) filtro.refeicao = b.dataset.ref;
      if (b.dataset.idade) filtro.idade = b.dataset.idade;
      paint();
    });
    $("#f-busca").addEventListener("input", e => { filtro.busca = e.target.value; paint(); });
    paint();
  };

  views.receita = (q, slug) => {
    const r = receitas.find(x=>x.slug===slug);
    if (!r) return `<div class="center" style="padding-top:4rem"><h1>Ops, receita não encontrada 🫣</h1><p style="margin-top:1rem"><a class="btn btn-primary" href="#receitas">Ver todas as receitas</a></p></div>`;
    const parecidas = receitas.filter(x=>x.slug!==r.slug && x.refeicao===r.refeicao).slice(0,3);
    const extras = [...(r.dicas||[]).map(d=>`<p><b>💡 Dica:</b> ${esc(d)}</p>`), ...(r.trocas||[]).map(t=>`<p><b>🔁 Troca:</b> ${esc(t)}</p>`)];
    return `
      <article class="stack" style="padding-top:2.5rem;max-width:48rem;margin:0 auto">
        <a class="chip bg-white no-print" href="#receitas">← Voltar para as receitas</a>
        <header class="card stack">
          <div class="emoji" style="font-size:4.5rem">${r.emoji}</div>
          <h1>${esc(r.nome)}</h1>
          <div class="row">${tagRef(r.refeicao)}${tagIdade(r.idadeMin)}<span class="chip sm">⏱️ ${r.tempo} min</span><span class="chip sm">🍽️ ${esc(r.rende)}</span></div>
          ${tagsAlg(r,false)}
          <p class="muted" style="font-size:.9rem">🚫🍬 Sem açúcar · 🧂 Sal opcional (só acima de 1 ano, uma pitadinha)</p>
        </header>
        <div class="grid grid-2">
          <section class="card"><h2 style="margin-bottom:.75rem">🧺 Ingredientes</h2><ul style="list-style:none;padding:0">${r.ingredientes.map(i=>`<li style="display:flex;gap:.5rem;margin-bottom:.4rem"><span style="color:var(--mint-dark)">●</span><span>${esc(i)}</span></li>`).join("")}</ul></section>
          <section class="card"><h2 style="margin-bottom:.75rem">👩‍🍳 Modo de preparo</h2>${r.modo.map((p,i)=>`<div class="step"><b>${i+1}</b><span style="padding-top:.25rem">${esc(p)}</span></div>`).join("")}</section>
        </div>
        ${extras.length?`<section class="card stack" style="background:rgba(255,240,166,.5)">${extras.join("")}</section>`:""}
        <div class="row no-print"><button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir receita</button><a class="btn btn-ghost" href="#gerar">✨ Gerar cardápio com IA</a></div>
        ${parecidas.length?`<section class="stack no-print"><h2>Você também pode gostar</h2><div class="row">${parecidas.map(p=>`<a class="chip bg-white" href="#receita/${p.slug}">${p.emoji} ${esc(p.nome)}</a>`).join("")}</div></section>`:""}
      </article>`;
  };

  /* ---------- gerador ---------- */
  const EXEMPLO = "ovos, aveia em flocos, batata-doce, abóbora, cenoura, frango, carne moída, arroz, feijão, maçã, mamão, abacate, leite de coco, azeite, alho, cebola";
  const ESPERA = ["Abrindo a geladeira... 🧊","Lavando os legumes... 🥕","Escolhendo as frutinhas... 🍓","Cortando tudo em palitinhos seguros... 🔪","Mexendo a panela... 🍲","Quase pronto, só ajeitando o pratinho... 🍽️"];
  const SECOES = [["cafe","🌞 Café da manhã","bg-sun"],["almocoJantar","🍽️ Almoço & jantar","bg-mint"],["lanche","🍓 Lanche","bg-berry"]];
  const STORAGE = "receitinhas:ultimo-cardapio";
  const g = { idade: "9m", restricoes: [], cardapio: null, quando: null, secao: "cafe", carregando: false, erro: null };
  try { const s = JSON.parse(localStorage.getItem(STORAGE)); if (s) { g.cardapio=s.cardapio; g.quando=s.quando; g.idade=s.pedido.idade; g.restricoes=s.pedido.restricoes; g.ingredientes=s.pedido.ingredientes; } } catch(e){}

  views.gerar = () => `
    <header class="stack" style="padding-top:2.5rem"><h1>✨ Gerar cardápio com IA</h1><p class="muted big" style="max-width:40rem">Escreva o que tem na sua geladeira e despensa. A gente devolve 7 cafés da manhã, 7 almoços ou jantares e 7 lanches, sem açúcar e respeitando as restrições. Se quiser, entre com a sua conta do ChatGPT para gerar com o seu próprio plano.</p></header>
    <section class="card no-print" id="g-login" style="margin-top:1.5rem;background:rgba(220,212,255,.4)"></section>
    <form class="card stack no-print" id="g-form" style="margin-top:1.5rem">
      <label><span class="label big">🧺 O que você tem em casa?</span><textarea class="input" id="g-ing" rows="4" required minlength="3" placeholder="Ex.: ovos, aveia, batata-doce, frango, cenoura, maçã...">${esc(g.ingredientes||"")}</textarea><button type="button" id="g-exemplo" style="font-size:.85rem;font-weight:800;color:var(--coral-dark);margin-top:.5rem;cursor:pointer">Usar uma lista de exemplo</button></label>
      <div class="grid grid-2">
        <div><span class="label big">👶 Idade</span><div class="row" id="g-idade"></div></div>
        <div><span class="label big">🩺 Restrições</span><div class="row" id="g-alg"></div><p class="muted" id="g-alg-hint" style="font-size:.75rem;margin-top:.5rem"></p></div>
      </div>
      <label><span class="label big">💬 Alguma observação? (opcional)</span><input class="input" id="g-obs" maxlength="500" placeholder="Ex.: não gosta de brócolis, tenho pouco tempo, estamos sem forno..."></label>
      <p class="alert hidden" id="g-erro" role="alert"></p>
      <div class="row"><button class="btn btn-primary big" id="g-btn" type="submit">✨ Gerar 21 ideias</button><span class="muted hidden" id="g-wait" style="font-weight:800" aria-live="polite"></span></div>
    </form>
    <section id="resultado" class="stack section"></section>`;
  views.gerar.after = () => {
    const loginBox = $("#g-login");
    const voltar = encodeURIComponent(location.href.split("?")[0].split("#")[0] + "#gerar");
    const q = new URLSearchParams(location.search);
    const avisoLogin = q.get("login") === "ok" ? "✅ Você entrou com o ChatGPT!" : q.get("login") === "erro" ? `😕 Não deu para entrar com o ChatGPT: ${q.get("motivo") || "tente de novo"}.` : q.get("login") === "nao-configurado" ? "😕 O login com ChatGPT ainda não foi configurado no app." : "";
    if (q.get("login")) history.replaceState({}, "", location.pathname + location.hash);
    const paintLogin = (me) => {
      const aviso = avisoLogin ? `<p style="font-weight:800;margin-bottom:.75rem">${esc(avisoLogin)}</p>` : "";
      if (me && me.usuario) {
        loginBox.innerHTML = aviso + `<div class="row" style="gap:.75rem">${me.usuario.foto?`<img src="${esc(me.usuario.foto)}" alt="" style="width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid #fff">`:`<span class="emoji" style="font-size:2rem">🧑‍🍳</span>`}<div style="flex:1;min-width:12rem"><p style="font-weight:800">Olá, ${esc(me.usuario.nome)}!</p><p class="muted" style="font-size:.9rem">${me.usuario.usaPlano?"As receitas serão geradas com o seu plano do ChatGPT.":me.geradorDoSite?"Seu plano do ChatGPT não liberou uso em outros apps, então vamos usar a IA do site.":"Seu plano do ChatGPT não liberou uso em outros apps (precisa ser Plus ou Pro)."}</p></div><button type="button" class="btn btn-ghost" id="g-sair">Sair</button></div>`;
        $("#g-sair").addEventListener("click", async () => { try { await fetch(APP_URL + "/api/auth/chatgpt/sair", { method: "POST", credentials: "include" }); } catch(e){} carregarMe(); });
      } else {
        loginBox.innerHTML = aviso + `<div class="row" style="gap:.75rem"><div style="flex:1;min-width:12rem"><p style="font-weight:800">Quer gerar com o seu ChatGPT?</p><p class="muted" style="font-size:.9rem">Entre com a sua conta: se você tem ChatGPT Plus ou Pro, as receitas usam o seu plano.${me&&me.geradorDoSite?" Sem login, usamos a IA do site mesmo.":""}</p></div><a class="btn btn-primary" href="${configurado?APP_URL+"/api/auth/chatgpt/start?voltar="+voltar:"#gerar"}" ${me&&!me.loginDisponivel?'style="opacity:.6" title="Login ainda não configurado"':""}>Entrar com ChatGPT</a></div>`;
      }
    };
    const carregarMe = () => {
      if (!configurado) { paintLogin({ loginDisponivel: false, geradorDoSite: false, usuario: null }); return; }
      fetch(APP_URL + "/api/me", { credentials: "include", cache: "no-store" }).then(r => r.json()).then(paintLogin).catch(() => paintLogin(null));
    };
    carregarMe();
    const paintForm = () => {
      $("#g-idade").innerHTML = Object.keys(IDADE_LABEL).map(k=>`<button type="button" class="chip ${g.idade===k?"bg-sky ring":""}" data-idade="${k}" aria-pressed="${g.idade===k}">${IDADE_LABEL[k]}</button>`).join("");
      $("#g-alg").innerHTML = ALG.map(a=>`<button type="button" class="chip ${g.restricoes.includes(a)?"on":""}" data-alg="${a}" aria-pressed="${g.restricoes.includes(a)}">${ALERGENOS[a].emoji} ${ALERGENOS[a].label}</button>`).join("");
      $("#g-alg-hint").textContent = g.restricoes.length ? "" : "Nenhuma marcada: receitas gerais (sem açúcar, sal opcional).";
    };
    const paintResult = () => {
      const c = g.cardapio, box = $("#resultado");
      if (!c) { box.innerHTML = ""; return; }
      box.innerHTML = `
        <div class="row" style="justify-content:space-between"><div><h2>Seu cardápio da semana</h2>${g.quando?`<p class="muted" style="font-size:.85rem">Gerado em ${esc(g.quando)} · fica salvo neste navegador</p>`:""}</div><div class="row no-print"><button class="btn btn-ghost" onclick="window.print()">🖨️ Imprimir</button><button class="btn btn-ghost" id="g-limpar">🗑️ Limpar</button></div></div>
        <div class="row no-print" role="tablist">${SECOES.map(([k,l,cor])=>`<button class="chip big ${g.secao===k?cor+" ring":"bg-white"}" role="tab" data-secao="${k}" aria-selected="${g.secao===k}">${l} <span style="opacity:.6">(${(c[k]||[]).length})</span></button>`).join("")}</div>
        ${SECOES.map(([k,l,cor])=>`<div class="${g.secao===k?"":"hidden print-show"}"><h3 class="hidden print-show" style="margin-bottom:.75rem">${l}</h3><div class="grid grid-3">${(c[k]||[]).map((d,i)=>`
          <div class="card" style="display:flex;flex-direction:column;gap:.75rem">
            <div style="display:flex;justify-content:space-between"><span class="chip sm ${cor}">Dia ${i+1}</span><span class="muted" style="font-size:.75rem;font-weight:800">⏱️ ${Number(d.tempoMin)||"?"} min</span></div>
            <div class="row" style="flex-wrap:nowrap"><span class="emoji" style="font-size:2.5rem">${esc(d.emoji||"🍽️")}</span><h4 style="font-size:1.2rem">${esc(d.nome)}</h4></div>
            <p class="note">💡 ${esc(d.dica||"")}</p>
            <button type="button" class="no-print" data-toggle style="font-size:.85rem;font-weight:800;color:var(--coral-dark);align-self:flex-start;cursor:pointer" aria-expanded="false">Ver receita ▼</button>
            <div class="hidden print-show stack" style="font-size:.9rem"><div><b>🧺 Ingredientes</b><ul>${(d.ingredientes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><b>👩‍🍳 Preparo</b><ol>${(d.modo||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div></div>
          </div>`).join("")}</div></div>`).join("")}
        ${(c.listaDeCompras||[]).length?`<div class="card" style="background:rgba(220,212,255,.5)"><h3 style="margin-bottom:.5rem">🛒 Faltou pouco: lista de compras</h3><div class="row">${c.listaDeCompras.map(x=>`<span class="chip bg-white">${esc(x)}</span>`).join("")}</div></div>`:""}`;
    };
    $("#g-exemplo").addEventListener("click", () => { $("#g-ing").value = EXEMPLO; });
    $("#g-form").addEventListener("click", e => {
      const b = e.target.closest("[data-idade],[data-alg]"); if(!b) return;
      if (b.dataset.idade) g.idade = b.dataset.idade;
      if (b.dataset.alg) g.restricoes = g.restricoes.includes(b.dataset.alg) ? g.restricoes.filter(x=>x!==b.dataset.alg) : [...g.restricoes, b.dataset.alg];
      paintForm();
    });
    $("#resultado").addEventListener("click", e => {
      const t = e.target.closest("[data-secao],[data-toggle],#g-limpar"); if(!t) return;
      if (t.dataset.secao) { g.secao = t.dataset.secao; paintResult(); }
      else if (t.hasAttribute("data-toggle")) { const d = t.nextElementSibling; const open = d.classList.toggle("hidden"); t.textContent = open ? "Ver receita ▼" : "Esconder receita ▲"; t.setAttribute("aria-expanded", String(!open)); }
      else if (t.id === "g-limpar") { g.cardapio = null; g.quando = null; try{localStorage.removeItem(STORAGE)}catch(e){} paintResult(); }
    });
    $("#g-form").addEventListener("submit", async e => {
      e.preventDefault();
      const pedido = { ingredientes: $("#g-ing").value, idade: g.idade, restricoes: g.restricoes, observacoes: $("#g-obs").value };
      const btn = $("#g-btn"), wait = $("#g-wait"), erro = $("#g-erro");
      erro.classList.add("hidden"); btn.disabled = true; btn.textContent = "Cozinhando..."; wait.classList.remove("hidden");
      let i = 0; const tick = () => { wait.innerHTML = `<span class="dot"></span> <span class="dot" style="animation-delay:.2s"></span> <span class="dot" style="animation-delay:.4s"></span> ${ESPERA[i++ % ESPERA.length]}`; }; tick(); const timer = setInterval(tick, 2500);
      try {
        if (!configurado) throw { erro: "O gerador ainda não está conectado: edite a linha APP_URL no início do arquivo com o endereço do seu app na Vercel." };
        const res = await fetch(API_URL, { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pedido) });
        const data = await res.json();
        if (!res.ok || !data.cardapio) throw { erro: data.erro || "Não deu certo. Tente de novo." };
        g.cardapio = data.cardapio; g.secao = "cafe"; g.ingredientes = pedido.ingredientes;
        g.quando = new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
        try { localStorage.setItem(STORAGE, JSON.stringify({ cardapio: g.cardapio, quando: g.quando, pedido })); } catch(e){}
        paintResult(); setTimeout(() => $("#resultado").scrollIntoView({ behavior: "smooth" }), 50);
      } catch (err) {
        erro.textContent = "😕 " + (err && err.erro ? err.erro : "Sem conexão com o servidor. Confira a internet e tente de novo."); erro.classList.remove("hidden");
      } finally { clearInterval(timer); btn.disabled = false; btn.textContent = "✨ Gerar 21 ideias"; wait.classList.add("hidden"); }
    });
    paintForm(); paintResult();
  };

  /* ---------- render ---------- */
  function render(){
    const { view, param, q } = route();
    const fn = views[view] || views.inicio;
    $("#app").innerHTML = fn(q, param);
    if (fn.after) fn.after();
    renderNav();
    window.scrollTo({ top: 0 });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
